<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>order summary component main</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="./img/favicon-32x32.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>


<body class="bg-bggg font-redhat bg-mobile-pattern lg:bg-desktop-pattern bg-no-repeat bg-top bg-contain">
    <main class="min-h-screen flex justify-center items-center ">
        <article class="bg-White max-w-450 rounded-20 overflow-hidden">
            <img class="w-full" src="./img/illustration-hero.svg" alt="img">
            <section class="flex flex-col px-12 pt-45 pb-50">
                <h1 class="text-preset-1 text-cd text-center">Order Summary</h1>
                <p class="text-preset-2 text-tp text-center pt-17 pb-20">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like! </p>
                <footer class="flex flex-col gap-32">
                    <div class="bg-mbg p-24 rounded-11 flex items-center justify-between">
                        <div class="flex items-center gap-5">
                            <img src="./img/icon-music.svg" alt="music icon">
                            <div class="flex flex-col gap-6 text-preset-3">
                                <h3 class="text-cd">Annual Plan</h3>
                                <span class="font-medium text-tp">$59.99/year</span>
                            </div>
                        </div>
                        <a class="text-preset-4 text-ch  underline hover:no-underline" href="#">Change</a>
                    </div>
                    <button class="text-preset-5 bg-ch rounded-11 text-White p-15">Proceed to Payment</button>
                    <a class="text-preset-5 text-tp hover:text-cd text-center" href="#">Cancel Order</a>
                </footer>
            </section>
        </article>
    </main>
</body>
</html>
